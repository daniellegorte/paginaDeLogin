<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'> 
    <link rel="stylesheet" href="style.css">
    <title> Login</title>
</head>
<body>

    <main class="container">
        <form>
            <h1 class="container__titulo"> Bem vindo! </h1>
            <div class="inserirDado">
                <input placeholder="Usuário" type="email">
                <i class="bx bxs-user"></i>
            </div>

            <div class="inserirDado">
                <input placeholder="Senha" type="password">
                <i class="bx bxs-lock-alt"></i>
            </div>

            <div class="lembrarSenha">
                <div class="lembrarSenha__input">
                    <input type="checkbox" id="lembrar">
                    <label for="lembrar">Lembrar senha</label>
                </div>
                <a href="#">Esqueci a senha</a> 
            </div>

            <button type="submit" class="login"> Login </button>
            
            <div class="cadastro"> 
                <p> Não tem uma conta? <a class="cadastro__destaque" href="#"> <strong> Cadastre-se </strong> </a> </p>
            </div>

        </form>
    </main>
    
</body>
</html>
